[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-terminal"
version = "1.0.0"
description = "Terminal-based image upload manager with inline preview for S3"
readme = "README.md"
license = {text = "MIT"}
# The nix devShell has always pinned python312. The 3.8 floor claimed support
# that was never built or tested against.
requires-python = ">=3.12"
dependencies = [
    "PyYAML",
    "Pillow",
    "boto3",
    "rich",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
photo-upload = "photo_terminal.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "import-linter",
]

[tool.setuptools.packages.find]
include = ["photo_terminal*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
]
# The formatter owns line length; E501 would only duplicate it and fire on
# strings and URLs that cannot be wrapped.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true

# Strict where the design's typed seams live - PreviewFrame, GraphicsProtocol,
# Layout, CellMetrics - and permissive over the modules that predate it, so new
# code is held to the standard without a four-thousand-line annotation backlog
# blocking the branch. Phases 3-6 widen this list as each package moves.
#
# `strict = true` is spelled out here rather than used as a single key: in a
# per-module section mypy applies several of the flags it implies globally, so
# the shorthand would have enforced strictness over the whole package.
[[tool.mypy.overrides]]
module = ["photo_terminal.terminal.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
implicit_reexport = false
warn_return_any = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
# An xfail that starts passing is a failure until the marker comes off.
xfail_strict = true
